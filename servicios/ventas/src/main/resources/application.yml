server:
  port: ${PORT:8082}
  error:
    # Sin esto los errores 400, 404 y 409 salen sin el campo "message".
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: ventas
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ventas}
    username: ${DB_USER:ventas}
    password: ${DB_PASSWORD:ventas_dev}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea db/schema.sql; Hibernate nunca toca las tablas.
      ddl-auto: none

# Dirección del servicio de Libros, al que Ventas pide descontar existencias.
libros:
  url: ${LIBROS_URL:http://localhost:8081}
