server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El balanceador y Docker usan esta ruta para saber que el contenedor responde.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Rutas del cliente (React Router): lo que no sea un archivo cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
