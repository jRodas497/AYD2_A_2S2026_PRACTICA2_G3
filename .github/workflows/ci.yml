name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'feat/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  libros:
    name: Libros (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: servicios/libros/pom.xml
      - name: mvn verify
        working-directory: servicios/libros
        run: mvn -B verify

  frontend:
    name: Frontend (tsc, Vitest, oxlint, build)
    runs-on: ubuntu-latest
    # El frontend todavía es la base copiada de la Fase 3 y no compila (faltan App, tipos de Libro y
    # el repositorio HTTP). Mientras se adapta, su fallo no bloquea el resto. Quitar esta línea
    # cuando el frontend compile.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: servicios/frontend/package-lock.json
      - name: npm ci
        working-directory: servicios/frontend
        run: npm ci
      - name: Tipos (tsc -b)
        working-directory: servicios/frontend
        run: npx tsc -b --noEmit
      - name: Pruebas unitarias (Vitest)
        working-directory: servicios/frontend
        run: npx vitest run
      - name: Lint (oxlint)
        working-directory: servicios/frontend
        run: npx oxlint
      - name: Build
        working-directory: servicios/frontend
        run: npm run build

  imagenes:
    name: Imagen ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    # Solo valida que el Dockerfile construye; no sube nada. El frontend sigue la misma suerte que su job.
    continue-on-error: ${{ matrix.servicio == 'frontend' }}
    strategy:
      fail-fast: false
      matrix:
        servicio: [libros, ventas, frontend, gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen linux/amd64
        if: hashFiles(format('servicios/{0}/Dockerfile', matrix.servicio)) != ''
        run: docker build --platform linux/amd64 -t "ayd-libreria/${{ matrix.servicio }}:ci" "servicios/${{ matrix.servicio }}"
      - name: Sin Dockerfile todavía
        if: hashFiles(format('servicios/{0}/Dockerfile', matrix.servicio)) == ''
        run: echo "::notice::servicios/${{ matrix.servicio }} aún no tiene Dockerfile; se omite."

  infraestructura:
    name: Terraform y Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Instalar Ansible
        run: |
          pip install --quiet ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: ansible syntax-check
        working-directory: ansible
        run: ansible-playbook -i inventario.ejemplo.ini --syntax-check site.yml
