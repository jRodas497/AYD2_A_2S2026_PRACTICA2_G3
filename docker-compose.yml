name: ayd-libreria

# Prueba local sin nube. Puertos propios (5433, 5434, 9081, 9082, 9080) para no chocar con otros proyectos.
# Las contraseñas son solo de desarrollo; en AWS las genera Terraform.
services:
  libros-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: libros
      POSTGRES_USER: libros
      POSTGRES_PASSWORD: libros_dev
    ports:
      - "5433:5432"
    volumes:
      - libros-datos:/var/lib/postgresql/data
      - ./servicios/libros/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libros -d libros"]
      interval: 5s
      timeout: 3s
      retries: 10

  libros:
    build: ./servicios/libros
    environment:
      DB_HOST: libros-db
      DB_PORT: "5432"
      DB_NAME: libros
      DB_USER: libros
      DB_PASSWORD: libros_dev
    ports:
      - "9081:8081"
    depends_on:
      libros-db:
        condition: service_healthy

  ventas-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ventas
      POSTGRES_USER: ventas
      POSTGRES_PASSWORD: ventas_dev
    ports:
      - "5434:5432"
    volumes:
      - ventas-datos:/var/lib/postgresql/data
      - ./servicios/ventas/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventas -d ventas"]
      interval: 5s
      timeout: 3s
      retries: 10

  ventas:
    build: ./servicios/ventas
    environment:
      DB_HOST: ventas-db
      DB_PORT: "5432"
      DB_NAME: ventas
      DB_USER: ventas
      DB_PASSWORD: ventas_dev
      LIBROS_URL: http://libros:8081
    ports:
      - "9082:8082"
    depends_on:
      ventas-db:
        condition: service_healthy
      libros:
        condition: service_started

  frontend:
    build: ./servicios/frontend

  gateway:
    build: ./servicios/gateway
    environment:
      LIBROS_HOST: libros
      VENTAS_HOST: ventas
      FRONTEND_HOST: frontend
    ports:
      - "9080:80"
    depends_on:
      - libros
      - ventas
      - frontend

volumes:
  libros-datos:
  ventas-datos:
